[project]
name = "muso-api"
version = "0.1.0"
description = "Muso · 妙作 — 内容创作工作台后端"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "celery>=5.6.3",
    "fastapi>=0.136.3",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "pillow>=11.3.0",
    "pydantic-ai>=1.107.0",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "__pycache__", "storage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E712", "F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
